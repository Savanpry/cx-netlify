        :root {

        .chat-window-wrapper .chat-window {
            border: none;

        .chat-input {
            max-height: 100px !important;
            overflow-y: auto;
            background: #f2f4f8;
        }
 
        .chat-inputs textarea {
            max-height: 80px !important;
            font-size: 0.9rem;
            line-height: 1.2rem;
        }
 
        .chat-inputs textarea::-webkit-scrollbar {
            width: 4px;
        }
 
        .chat-inputs textarea::-webkit-scrollbar-thumb {
            background-color: #999;
            border-radius: 4px;
        }
 
        .chat-inputs textarea::-webkit-scrollbar-track {
            background: #d3d3d3;
        }
 
        .chat-input::after {
            content: "Responses are AI-generated and may contain mistakes.";
            display: block;
            margin-bottom: 6px;
            margin-top: 6px;
            font-size: 12px;
            color: #8a8a8a;
            text-align: center;
        }
 
        .chat-input::-webkit-scrollbar {
            width: 0px;
        }

    box-shadow: none;

}

function init() {
  scene = new THREE.Scene();

function createRadialFadeLineGrid({
  y = 0,
  size = 100,
  divisions = 40,
  innerRadius = 30,
  outerRadius = 50,
  color = new THREE.Color(0xffffff),
  opacity = 0.3 // ✅ new param
}) {
  const gridGroup = new THREE.Group();

  const material = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPosition.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vWorldPos;
      uniform float innerRadius;
      uniform float outerRadius;
      uniform vec3 gridColor;
      uniform float opacity;

      void main() {
        float dist = length(vWorldPos.xz);
        float alpha = smoothstep(innerRadius, outerRadius, dist);
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(gridColor, alpha * opacity);
      }
    `,
    uniforms: {
      innerRadius: { value: innerRadius },
      outerRadius: { value: outerRadius },
      gridColor: { value: color },
      opacity: { value: opacity } // ✅ passed into shader
    },
    transparent: true,
    depthTest: false
  });

  const step = size / divisions;
  const half = size / 2;
  const centerIndex = Math.floor(divisions / 2);

  for (let i = 0; i <= divisions; i++) {
    if (i === centerIndex) continue;

    const offset = -half + i * step;

    const vertGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(offset, y, -half),
      new THREE.Vector3(offset, y, half),
    ]);
    gridGroup.add(new THREE.Line(vertGeom, material));

    const horizGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-half, y, offset),
      new THREE.Vector3(half, y, offset),
    ]);
    gridGroup.add(new THREE.Line(horizGeom, material));
  }

  return gridGroup;
}





function createParticles() {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  function sphericalDistribution(i) {
    const phi = Math.acos(-1 + (2 * i) / count);
    const theta = Math.sqrt(count * Math.PI) * phi;
    return {
      x: 8 * Math.cos(theta) * Math.sin(phi),
      y: 8 * Math.sin(theta) * Math.sin(phi),
      z: 8 * Math.cos(phi)
    };
  }

  for (let i = 0; i < count; i++) {
    const point = sphericalDistribution(i);
    positions[i * 3] = point.x + (Math.random() - 0.5) * 0.5;
    positions[i * 3 + 1] = point.y + (Math.random() - 0.5) * 0.5;
    positions[i * 3 + 2] = point.z + (Math.random() - 0.5) * 0.5;

    const color = new THREE.Color();
    const depth = Math.sqrt(point.x ** 2 + point.y ** 2 + point.z ** 2) / 8;
    color.setHSL(0.01, 0.84, Math.max(0, 0.67 - depth * 0.1));

    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true
  });

  particles = new THREE.Points(geometry, material);
  scene.add(particles);
}

function setupCycle() {
  const svgData404 = `

    <path d="M0 365.108V310.662L156.862 12.8108H220.887L64.0252 310.662H233.692V195.365H291.315V310.662H358.541V365.108H291.315V461.189H233.692V365.108H0Z" fill="black"/>

  </svg>
  `;

  const svgDataURI = 'data:image/svg+xml;base64,' + window.btoa(svgData404);

  const svgs = [
    svgDataURI
  ];

  let index = 0;

  function cycle() {
    const url = svgs[index];
    index = (index + 1) % svgs.length;

    loadSVGPoints(url, (points) => {
      morphToShape(points, () => {
          morphToSphere(() => {
          setTimeout(cycle, 1000);
        });
      });
    });
  }

  cycle();
}

function loadSVGPoints(url, callback) {
  const loader = new THREE.SVGLoader();

  loader.load(
    url,
    (data) => {
      const paths = data.paths;
      const allPoints = [];

      // Estimate how many points to extract per subpath
      const totalSubpaths = paths.reduce((acc, path) => acc + path.subPaths.length, 0);
      const pointsPerSubpath = Math.floor(count / totalSubpaths);

      paths.forEach((path) => {
        path.subPaths.forEach((subPath) => {
          const spaced = subPath.getSpacedPoints(pointsPerSubpath);
          spaced.forEach((pt) => {
            allPoints.push({ x: pt.x, y: pt.y });
          });
        });
      });

      const normalized = normalizePoints(allPoints);
      callback(normalized);
    },
    undefined,
    (error) => {
      console.error("SVG Load Error:", error.message);
    }
  );
}



// Normalize and center SVG points so shape is centered and scaled nicely
function normalizePoints(points) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

  points.forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });

  const width = maxX - minX;
  const height = maxY - minY;
  const maxSize = 12;
  const scale = maxSize / Math.max(width, height);

  return points.map(p => ({
    x: (p.x - minX - width / 2) * scale,
    y: -(p.y - minY - height / 2) * scale
  }));
}


function morphToShape(shapePoints, onComplete) {
  currentState = 'shape';

  // Reset rotation so SVG shape faces front (no tilt/rotation)
  gsap.to(particles.rotation, { x: 0, y: 0, z: 0, duration: 1 });

  const positions = particles.geometry.attributes.position.array;
  const startPositions = new Float32Array(positions); // copy current
  const targetPositions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    if (i < shapePoints.length) {
      targetPositions[i * 3] = shapePoints[i].x;
      targetPositions[i * 3 + 1] = shapePoints[i].y;
      targetPositions[i * 3 + 2] = 0;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * 20 + 10;
      targetPositions[i * 3] = Math.cos(angle) * radius;
      targetPositions[i * 3 + 1] = Math.sin(angle) * radius;
      targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
    }
  }

  let progress = { t: 0 };

  gsap.to(progress, {
    t: 1,
    duration: 2,
    ease: "power2.inOut",
    onUpdate: () => {
      for (let i = 0; i < positions.length; i++) {
        positions[i] = startPositions[i] + (targetPositions[i] - startPositions[i]) * progress.t;
      }
      particles.geometry.attributes.position.needsUpdate = true;
    },
    onComplete: () => {
      if (typeof onComplete === 'function') onComplete();
    }
  });
}
function createSmoke() {

  const targetPositions = new Float32Array(count * 3);
  const targetColors = new Float32Array(count * 3);

  function sphericalDistribution(i) {
    const phi = Math.acos(-1 + (2 * i) / count);
    const theta = Math.sqrt(count * Math.PI) * phi;
    return {
      x: 8 * Math.cos(theta) * Math.sin(phi),
      y: 8 * Math.sin(theta) * Math.sin(phi),
      z: 8 * Math.cos(phi)
    };
  }

  for (let i = 0; i < count; i++) {
    const point = sphericalDistribution(i);
    targetPositions[i * 3] = point.x + (Math.random() - 0.5) * 0.5;
    targetPositions[i * 3 + 1] = point.y + (Math.random() - 0.5) * 0.5;
    targetPositions[i * 3 + 2] = point.z + (Math.random() - 0.5) * 0.5;

    const depth = Math.sqrt(point.x ** 2 + point.y ** 2 + point.z ** 2) / 8;
    const color = new THREE.Color();
    color.setHSL(0.01, 0.84, Math.max(0, 0.67 - depth * 0.1));

    targetColors[i * 3] = color.r;
    targetColors[i * 3 + 1] = color.g;
    targetColors[i * 3 + 2] = color.b;
  }

  let progress = { t: 0 };

  gsap.to(progress, {
    t: 1,
    duration: 2,
    ease: "power2.inOut",
    onUpdate: () => {
      for (let i = 0; i < positions.length; i++) {
        positions[i] = startPositions[i] + (targetPositions[i] - startPositions[i]) * progress.t;
        colors[i] = startColors[i] + (targetColors[i] - startColors[i]) * progress.t;
      }
      particles.geometry.attributes.position.needsUpdate = true;
      particles.geometry.attributes.color.needsUpdate = true;
    },
    onComplete: () => {
      if (typeof onComplete === 'function') onComplete();
    }
  });
}
function screenToWorld(ndcX, ndcY, z) {
  const vector = new THREE.Vector3(ndcX, ndcY, z); // NDC space
  vector.unproject(camera);
  return vector;
}
function animate() {
  const radius = 25;
  const angleX = mouse.x * Math.PI * 0.2; // Horizontal rotate
  const angleY = mouse.y * Math.PI * 0.1; // Vertical tilt

  const targetX = radius * Math.sin(angleX);
  const targetZ = radius * Math.cos(angleX);
  const targetY = radius * angleY * 0.5;

  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.y += (targetY - camera.position.y) * 0.05;
  camera.position.z += (targetZ - camera.position.z) * 0.05;

  camera.lookAt(0, 0, 0);
  requestAnimationFrame(animate);

  // Animate particle rotation
  if (currentState === 'sphere') {
    particles.rotation.y += 0.002;
  }

  // Project bottom corners into world space
  const depthZ = 0; // Use 0 to place at front plane

  const left = screenToWorld(-1, -1, depthZ);
  const right = screenToWorld(1, -1, depthZ);

  leftCornerLight.position.copy(left);
  rightCornerLight.position.copy(right);
  smokeCloud.forEach((plane, i) => {
    plane.rotation.z += 0.0005 + i * 0.00001;
  });
  renderer.render(scene, camera);
}


window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
